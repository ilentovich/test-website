<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Your 2L17</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    /* Подключаем наш файл шрифта */
    @font-face {
      font-family: 'Fixedsys'; /* Придумываем название, по нему будем вызывать */
      src: url('fixedsys.ttf') format('ttf'); /* Укажи имя файла, которое загрузил (например, font.ttf) */
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'Arial', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
  
      /* Настройки фона с картинкой */
      background-color: #7b2cbf; /* Фиолетовый цвет остается как запасной */
      background-image: linear-gradient(rgba(123, 44, 191, 0.75), rgba(123, 44, 191, 0.75)), url('bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
      width: 100%;
    h1 { 
      text-align: center; 
      font-family: 'Fixedsys', Arial, sans-serif; /* Если шрифт не загрузится, покажет Arial */
      font-size: 32px; 
      color: white; 
      text-transform: uppercase; 
      margin-bottom: 25px;
    }
    }
    input[type="file"] { display: none; }
    .custom-file-upload {
      border: 2px dashed #fff;
      display: inline-block;
      padding: 20px;
      cursor: pointer;
      border-radius: 10px;
      margin-bottom: 15px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background-color: #1abc9c;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    #preview-container { margin-top: 20px; display: none; }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      touch-action: none;
    }
  </style>
</head>
<body>

  <h1>make ur 2l17</h1>

  <div class="container">
    <p>загрузи фото - оно подставится в обложку</p>
    
    <label class="custom-file-upload">
      <input type="file" id="imageLoader" accept="image/*" />
      нажми, чтобы загрузить фото
    </label>

    <div id="preview-container">
      <canvas id="canvas"></canvas>
      <p style="font-size: 12px; margin: 10px 0;">регулируй фото пальцем или мышкой</p>

      <!-- НОВАЯ КНОПКА -->
      <button id="resetBtn" style="background-color: transparent; border: 2px solid #fff; margin-bottom: 10px;">поставить другое фото</button>
      
      <button id="downloadBtn">скачать картинку</button>
    </div>
  </div>

  <script>
    // --- НАСТРОЙКИ ---
    const COVER_IMAGE_URL = 'cover.png'; 
    const CANVAS_SIZE = 1024; 
    
    const HEAD_SIZE = 185; 
    const HEAD_X = 512;    
    const HEAD_Y = 180;    

    const imageLoader = document.getElementById('imageLoader');
    const canvasElement = document.getElementById('canvas');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewContainer = document.getElementById('preview-container');
    const resetBtn = document.getElementById('resetBtn'); // <--- ДОБАВИТЬ ЭТО

    let canvas;

    imageLoader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Создаем URL для загруженного фото
      const userImageUrl = URL.createObjectURL(file);
      const userImg = new Image();
      userImg.src = userImageUrl;
      
      userImg.onload = () => {
        const coverImg = new Image();
        coverImg.crossOrigin = "Anonymous";
        coverImg.src = COVER_IMAGE_URL;
        
        coverImg.onload = () => {
          
          // --- ШАГ 1: Вырезаем дырку в обложке ---
          const offCanvas = document.createElement('canvas');
          offCanvas.width = CANVAS_SIZE;
          offCanvas.height = CANVAS_SIZE;
          const ctx = offCanvas.getContext('2d');

          ctx.drawImage(coverImg, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
          
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(HEAD_X, HEAD_Y, HEAD_SIZE / 2, 0, Math.PI * 2);
          ctx.fill();

          const transparentCover = new Image();
          transparentCover.src = offCanvas.toDataURL();

          transparentCover.onload = () => {
              if (canvas) { canvas.dispose(); } // Если старый холст был, удаляем его
  
              canvas = new fabric.Canvas(canvasElement, {
              width: CANVAS_SIZE,
              height: CANVAS_SIZE,
              selection: false
            });

            // --- ШАГ 2: Фото пользователя (ЛЕЖИТ ПОД ОБЛОЖКОЙ) ---
            const userFabricImg = new fabric.Image(userImg, {
              originX: 'center',
              originY: 'center',
              left: HEAD_X,
              top: HEAD_Y,
              borderColor: '#1abc9c', 
              cornerColor: '#1abc9c', 
              cornerSize: 30,
              transparentCorners: false,
              hasBorders: true,
              lockScalingFlip: true,
              lockRotation: true
            });

            // Масштабируем, чтобы фото точно закрыло круг
            const scale = Math.max(HEAD_SIZE / userImg.width, HEAD_SIZE / userImg.height) * 1.5;
            userFabricImg.scale(scale);

            // Обрезаем фото под круг (даже если это пейзаж)
            userFabricImg.clipPath = new fabric.Circle({
              radius: HEAD_SIZE / 2,
              left: HEAD_X, 
              top: HEAD_Y,
              originX: 'center', originY: 'center',
              absolutePositioned: true
            });

            canvas.add(userFabricImg);
            // --- ОГРАНИЧИВАЕМ ДВИЖЕНИЕ ФОТО ВНУТРИ КРУГА ---
            // --- УМНЫЕ СТЕНЫ (НЕ ДАЮТ ОГОЛИТЬ КРАЯ) ---
            canvas.on('object:moving', function(e) {
              var obj = e.target;
              var center = obj.getCenterPoint();
              
              // Считаем, насколько фото больше круга
              var halfPhotoWidth = obj.getScaledWidth() / 2;
              var halfPhotoHeight = obj.getScaledHeight() / 2;
              var radius = HEAD_SIZE / 2;
            
              // Если фото ШИРЕ круга, мы разрешаем двигать его влево-вправо, 
              // но не даем краям отойти от центра круга дальше, чем на разницу в размерах.
              // Если фото УЖЕ круга, мы вообще не даем ему двигаться по этой оси (оно должно быть по центру).
              
              var maxOffsetX = Math.max(0, halfPhotoWidth - radius);
              var maxOffsetY = Math.max(0, halfPhotoHeight - radius);
            
              var limitLeft = HEAD_X - maxOffsetX;
              var limitRight = HEAD_X + maxOffsetX;
              var limitTop = HEAD_Y - maxOffsetY;
              var limitBottom = HEAD_Y + maxOffsetY;
            
              // Жестко стопарим, если вылезли за пределы
              if (center.x < limitLeft) obj.left += (limitLeft - center.x);
              if (center.x > limitRight) obj.left -= (center.x - limitRight);
              if (center.y < limitTop) obj.top += (limitTop - center.y);
              if (center.y > limitBottom) obj.top -= (center.y - limitBottom);
            });

            // --- ШАГ 3: Обложка с дыркой (ПОВЕРХ ФОТО) ---
            const coverFabricImg = new fabric.Image(transparentCover, {
              left: 0, top: 0,
              selectable: false,
              evented: false,
              absolutePositioned: true
            });
            
            canvas.add(coverFabricImg);
            
            canvas.setActiveObject(userFabricImg); 
            canvas.renderAll();

            previewContainer.style.display = 'block';
          };
        };
      };
    });

    // --- Кнопка скачивания ---
    downloadBtn.addEventListener('click', () => {
      if (!canvas) return;
      canvas.discardActiveObject();
      canvas.renderAll();
  
      // 1. Спрашиваем у пользователя название
      let userName = prompt("введи название файла:", "");
  
      // Если пользователь нажал "Отмена" или ввел пустоту, ставим название по умолчанию
      if (!userName || userName.trim() === "") {
        userName = "mixtape";
      }
  
      // 2. Очищаем текст от запрещенных символов (чтобы файл не сломался)
      // Убираем пробелы и спецсимволы, оставляем только буквы и цифры
      userName = userName.trim().replace(/[^a-zA-Zа-яА-Я0-9]/g, '');
  
      // Если после очистки ничего не осталось (одни маты или знаки), ставим дефолт
      if (userName === "") {
        userName = "mixtape";
      }

      // 3. Формируем уникальное имя
      const finalFileName = `${userName}-2l17.png`;

      // 4. Скачиваем
      const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
      const link = document.createElement('a');
      link.download = finalFileName; // Подставляем наше уникальное имя
      link.href = dataURL;
      link.click();
    });

    // --- Кнопка "Поставить другое фото" ---
    resetBtn.addEventListener('click', () => {
      // 1. Очищаем холст от старых фото и обложек
      if (canvas) {
        canvas.clear();
        canvas.dispose(); // Полностью удаляем старый холст из памяти
        canvas = null;    // Обнуляем переменную
      }
  
      // 2. Прячем превью и очищаем поле выбора файла
      previewContainer.style.display = 'none';
      imageLoader.value = ''; // Это позволяет выбрать тот же самый файл повторно
  
      // 3. Программно нажимаем на скрытый input, чтобы сразу открылось окно выбора
      imageLoader.click();
    });
    
  </script>
</body>
</html>
